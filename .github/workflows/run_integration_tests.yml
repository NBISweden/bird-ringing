name: Integration tests

#on:
#  pull_request:
#    branches: [main, develop]
on:
  #   --- Testing branch ---
  push:
    branches:
      - 210-run-integration-tests-as-gh-actions-v1

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration test dependencies
        run: python -m pip install requests

      - name: Create Docker secrets
        run: |
          mkdir -p secrets
          printf '%s' 'postgres-test-password' > secrets/postgres-pass.txt
          printf '%s' 'db-admin-test-password' > secrets/db-admin-pass.txt
          printf '%s' 'db-user-test-password' > secrets/db-user-pass.txt
          printf '%s' 'integration-test-secret-key' > secrets/django-secret-key.txt
          printf '%s' 'integration-test-email-password' > secrets/django-email-password.txt

      - name: Create integration test config
        run: |
          cat > docker-compose.override.yml <<'EOF'
          services:
            backend:
              ports:
                - "127.0.0.1:3210:8000"
              environment:
                SERVICE_MODE: production
                DJANGO_ALLOWED_HOSTS: "backend, localhost"
                LICENSE_CARD_FILE: /test-resources/license-card-test.svg
                PERMIT_TEMPLATE_FILE: /test-resources/permit-test.docx
                LICENSING_COMMUNICATION_LANGUAGE_CODE: "sv"
                GUNICORN_WORKERS: 5
                GUNICORN_TIMEOUT: 120
              volumes:
                - ./integration_tests/test-resources:/test-resources:ro
          EOF

      # Pull the expensive prebuilt converter instead of rebuilding LibreOffice.
      - name: Pull docx2pdf image
        run: ./compose-dev.sh pull docx2pdf

      # Only backend contains code exercised by these integration tests.
      - name: Build backend
        run: ./compose-dev.sh build backend

      # Starting backend automatically starts its dependency chain:
      # database-init -> database -> backend-init, plus docx2pdf.
      # Frontend, proxy and mailpit are intentionally not started.
      - name: Start integration test stack
        run: ./compose-dev.sh up --no-build -d backend

      - name: Create test users
        run: ./create-test-users

      - name: Initialize minimal test data
        run: ./data-init-ci

      - name: Run integration tests
        run: python integration_tests/test_api.py

      - name: Show logs on failure
        if: failure()
        run: |
          ./compose-dev.sh ps -a
          ./compose-dev.sh logs --no-color backend
          ./compose-dev.sh logs --no-color backend-init
          ./compose-dev.sh logs --no-color docx2pdf
          ./compose-dev.sh logs --no-color database

      - name: Stop test stack
        if: always()
        run: ./compose-dev.sh down -v
