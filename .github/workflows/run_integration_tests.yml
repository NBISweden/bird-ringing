name: Integration tests

#on:
#  pull_request:
#    branches: [main, develop]
on:
  #   --- Testing branch ---
  push:
    branches:
      - 210-run-integration-tests-as-gh-actions-v1

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration test dependencies
        run: |
          python -m pip install requests

      - name: Create Docker secrets
        run: |
          mkdir -p secrets
          printf '%s' 'postgres-test-password' > secrets/postgres-pass.txt
          printf '%s' 'db-admin-test-password' > secrets/db-admin-pass.txt
          printf '%s' 'db-user-test-password' > secrets/db-user-pass.txt
          printf '%s' 'integration-test-secret-key' > secrets/django-secret-key.txt
          printf '%s' 'integration-test-email-password' > secrets/django-email-password.txt

      - name: Create integration test config
        run: |
          cat > docker-compose.override.yml <<'EOF'
          services:
            backend:
              environment:
                DJANGO_ALLOWED_HOSTS: "backend, localhost"
                LICENSE_CARD_FILE: /resources/Licenskort_för_ringmärkning-2026.svg
                LICENSING_COMMUNICATION_LANGUAGE_CODE: "sv"
                PERMIT_TEMPLATE_FILE: /resources/templates/permit.docx
                GUNICORN_WORKERS: 3
                GUNICORN_TIMEOUT: 120
          EOF

      - name: Start dev stack
        run: |
          ./compose-dev.sh up --build -d

      - name: Create test users
        run: |
          ./create-test-users    

      - name: Initialize test data
        run: ./data-init

      - name: Run integration tests
        run: |
          python integration_tests/test_api.py

      - name: Show logs on failure
        if: failure()
        run: |
          ./compose-dev.sh ps -a
          ./compose-dev.sh logs --no-color backend
          ./compose-dev.sh logs --no-color backend-init
          ./compose-dev.sh logs --no-color docx2pdf

      - name: Stop dev stack
        if: always()
        run: |
          ./compose-dev.sh down -v